name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A quiet repo gets no CI at all: between 2026-07-19 and 2026-08-28 nothing was
  # pushed, nothing ran, and a stale green badge covered a broken
  # `pip install "pyshal[mcp]"` for 34 days (#105/#106). Time-based runs decouple
  # "is the published package still installable" from "did anyone commit".
  # 06:17 UTC Monday — deliberately off the hour and off midnight; GitHub's
  # scheduler is most congested at :00 and at 00:00 UTC and delays runs there.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest --cov=shal --cov-report=term-missing

  examples:
    # Keep examples/ alive: a src/shal change that breaks a demo or the
    # generation benchmark fails CI here instead of rotting silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Driver-creator benchmark (4 cases, generated drivers vs harness)
        run: python examples/driver-creator/run_benchmark.py
      - name: Registry manifests in sync with drivers (re-emit -> no diff)
        run: |
          python examples/driver-creator/emit_manifest.py
          git diff --exit-code -- 'examples/**/device.yaml' 'examples/**/metadata.yaml'
      - name: Demos run headless
        run: |
          python examples/demos/sonos/demo_sim.py
          python examples/demos/deebot/demo_sim.py
          python examples/demos/mesh/demo_mesh.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build
      - name: sdist excludes examples/, tests/ and dev/ (the test approver must never ship, #78)
        run: |
          tar tzf dist/*.tar.gz | grep -E '/(examples|tests|dev)/' && exit 1 || echo "clean"
      - name: Wheel smoke — install the built wheel clean and run the CLI
        run: |
          python -m venv /tmp/ws
          /tmp/ws/bin/pip install "$(ls dist/*.whl)"
          /tmp/ws/bin/shal --help
          /tmp/ws/bin/shal docs | head -1
          /tmp/ws/bin/shal-mcp --help > /dev/null
          # the in-package agent guide must ship (the self-sufficiency promise, #55)
          /tmp/ws/bin/python -c "from importlib.resources import files; assert (files('shal')/'AGENT_GUIDE.md').is_file(), 'AGENT_GUIDE.md missing from the wheel'"
      - name: agenticQA release-acceptance — cold-install the sdist + drive the gate (sim, #78)
        run: python dev/eval/agenticqa/run.py --all --from-tarball "$(ls dist/*.tar.gz)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  latest-deps:
    # Upstream canary (#106). The `test` job installs `.[dev]`, which honours the
    # declared ceilings (`mcp>=1.0,<2` since #107) — so it can never see the next
    # major, which is exactly the class of break that hit users in #105. This job
    # deliberately steps past every ceiling and runs the suite against whatever
    # PyPI ships today, so an upstream major release fails our build instead of
    # only failing a fresh `pip install`.
    #
    # Not in the required-checks list on purpose: an upstream major breaking is
    # news, not a broken PR, and nobody in this repo caused it. It is also gated to
    # scheduled/manual runs so it never paints a red X on an unrelated PR.
    #
    # Deliberately NOT `continue-on-error: true`. That would keep the workflow run
    # green, which means no red run on the Actions tab and no failure email — a
    # canary nobody looks at is worth nothing, and this issue exists precisely
    # because a green signal hid a real break. The cost of that choice is honest:
    # the scheduled run goes red for something no contributor did, and someone has
    # to triage it. Not being a required check is what keeps that from blocking work.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install shal without resolving its pins
        # --no-deps so pip never applies pyproject's ceilings to the next step.
        run: pip install --no-deps -e .
      - name: Install dependencies unpinned (latest on PyPI today)
        run: pip install --upgrade pyyaml jsonschema mcp pytest pytest-cov
      - name: Resolved versions
        run: pip list
      - name: Import the MCP server (the #105 break was at import time)
        run: |
          python -c "import shal, shal.mcp.server; print('shal', shal.__version__)"
          shal-mcp --help > /dev/null
          shal mcp --help > /dev/null
      - name: Test
        run: python -m pytest
